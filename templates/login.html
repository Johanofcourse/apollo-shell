<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Apollo Dashboard — Sign In</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #161d27;
      --border: #26313f;
      --text: #e6edf3;
      --muted: #8b98a5;
      --crit: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2.5rem;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    h1 { font-size: 1.2rem; margin: 0 0 0.5rem; }
    .sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 2rem; }
    .error {
      color: var(--crit);
      font-size: 0.85rem;
      margin: 0 0 1.5rem;
    }
    .google-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.7rem 1rem;
      background: #fff;
      color: #1f1f1f;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .google-btn:hover { background: #f1f1f1; }
    .google-btn svg { width: 18px; height: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Apollo Dashboard</h1>
    <p class="sub">Sign in with an authorized Google account to continue.</p>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
    <a class="google-btn" href="{{ url_for('google_login') }}">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.2-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 16.3 3 9.6 7.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.4 0 10.3-1.9 14.1-5.4l-6.5-5.5c-2 1.5-4.6 2.4-7.6 2.4-5.2 0-9.6-3.3-11.3-8l-6.5 5c3.3 6.7 10 11.5 17.8 11.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.5 5.5C41.6 35.6 45 30.2 45 24c0-1.4-.2-2.7-.4-3.5z"/></svg>
      Sign in with Google
    </a>
  </div>
</body>
</html>
